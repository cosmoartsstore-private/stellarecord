name: CI

# クリーンな環境で全テスト・lint を実行する回帰ゲート。
# master への push と、master 宛 PR で自動実行される。
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一ブランチで新しい push があれば実行中のジョブをキャンセルする。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust Backend の registry/ファイル I/O 検証には Windows が必要である。
  rust:
    name: Rust (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6

      # native連携検証はNodeでTypeScriptを直接実行し、esbuildを使用する。
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      # rust-toolchain.toml で 1.93.0 + clippy/rustfmt + MSVC target がピン留めされている。
      # rustup が自動でその toolchain を導入する。
      - name: Show toolchain
        run: rustup show

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        # 手動で保つ式のまとまりと検査対象外のtest記法を、整形の強制で書き換えない。
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Unit tests
        # Shell・WebView2の終了処理と、他のOS連携fixtureの起動・削除を重ねない。
        env:
          RUST_TEST_THREADS: 1
        run: cargo test --locked --all-targets

  # Frontend の Vitest と ESLint 検証には ubuntu-latest を使用する。
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: Stylelint
        run: npm run stylelint

      - name: ESLint
        run: npm run lint

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build
